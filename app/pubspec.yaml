name: hasan_vpn
description: Hasan VPN
publish_to: "none"
version: 10.0.0+100

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # نسخه‌ی 1.1.6 (15 سپتامبر 2026) رفتار VPN را عوض کرد؛ پین شد.
  flutter_vless: 1.1.5
  http: ^1.1.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  package_info_plus: ^8.0.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  path_provider: ^2.1.0

dependency_overrides:
  # DEFECT 6 FIXED: path is relative to the directory that contains THIS
  # pubspec at `flutter pub get` time. CI copies the fork to
  # build_src/plugins/flutter_vless_android before pub get, and this
  # pubspec is copied to build_src/pubspec.yaml — so the resolved path is
  # build_src/plugins/flutter_vless_android.
  flutter_vless_android:
    path: plugins/flutter_vless_android

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
