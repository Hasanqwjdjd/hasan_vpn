name: Build HEV tun2socks (arm64-v8a)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      - name: Clone with submodules
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 --branch 2.18.0 \
            https://github.com/heiher/hev-socks5-tunnel.git src
          cd src
          echo "=== top level ==="
          ls -la
          echo "=== third-part ==="
          ls -la third-part/ 2>/dev/null
          echo "=== Android.mk ==="
          cat Android.mk
          echo "=== Application.mk ==="
          cat Application.mk

      - name: Build with ndk-build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd src
          NDK_BUILD="${ANDROID_NDK_HOME}/ndk-build"
          echo "using $NDK_BUILD"
          "$NDK_BUILD" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk \
            APP_ABI=arm64-v8a APP_PLATFORM=android-21 \
            -j"$(nproc)" 2>&1 | tail -80
          echo "=== output tree ==="
          find libs -type f 2>/dev/null
          ls -la libs/arm64-v8a/ 2>/dev/null || true

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          cd src
          BIN=""
          for cand in \
            libs/arm64-v8a/hev-socks5-tunnel \
            libs/arm64-v8a/libtun2socks.so \
            obj/local/arm64-v8a/hev-socks5-tunnel; do
            if [ -f "$cand" ]; then BIN="$cand"; break; fi
          done
          if [ -z "$BIN" ]; then
            BIN=$(find libs obj -type f 2>/dev/null | xargs -r file 2>/dev/null \
              | grep -iE "ELF.*(aarch64|ARM aarch64)" | head -1 | cut -d: -f1 || true)
          fi
          if [ -z "$BIN" ]; then
            echo "no binary found"
            find . -type f -name "*.so" 2>/dev/null | head -20
            exit 1
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          file "$BIN"
          ls -lh "$BIN"

      - name: Install into jniLibs
        run: |
          set -euo pipefail
          mkdir -p android-extra/jniLibs/arm64-v8a
          cp "src/$BIN" android-extra/jniLibs/arm64-v8a/libtun2socks.so
          chmod +x android-extra/jniLibs/arm64-v8a/libtun2socks.so
          file android-extra/jniLibs/arm64-v8a/libtun2socks.so
          ls -lh android-extra/jniLibs/arm64-v8a/libtun2socks.so

      - name: Commit .so back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-extra/jniLibs/arm64-v8a/libtun2socks.so
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "[skip ci] chore(hev): build hev-socks5-tunnel 2.18.0 for arm64-v8a"
          git push
