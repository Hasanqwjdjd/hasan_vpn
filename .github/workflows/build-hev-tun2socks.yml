name: Build HEV tun2socks (arm64-v8a)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 git

      - name: Clone hev-socks5-tunnel 2.18.0
        run: |
          git clone --depth 1 --branch 2.18.0 \
            https://github.com/heiher/hev-socks5-tunnel.git src

      - name: Inspect repo layout
        run: |
          set -euo pipefail
          cd src
          echo "=== root ==="
          ls -la
          echo "=== find CMakeLists.txt ==="
          find . -name CMakeLists.txt -not -path "./third-part/*" 2>/dev/null
          echo "=== find Makefile ==="
          find . -name Makefile -not -path "./third-part/*" 2>/dev/null | head -10
          echo "=== find main.c / hev-main.c ==="
          find . -name "*.c" -not -path "./third-part/*" 2>/dev/null | head -20

      - name: Build (make, arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd src
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="${NDK_BIN}/aarch64-linux-android21-clang"
          export AR="${NDK_BIN}/llvm-ar"
          export LD="${NDK_BIN}/ld.lld"
          export CROSS_COMPILE="aarch64-linux-android-"
          # The project uses a Makefile at root; run it.
          make -j"$(nproc)" \
            CC="$CC" AR="$AR" LD="$LD" \
            CFLAGS="-O2 -fPIE" LDFLAGS="-pie" 2>&1 | tail -60 || true
          echo "=== build dir ==="
          find . -type f -executable -not -path "./third-part/*" 2>/dev/null | head
          ls -la bin/ build/ 2>/dev/null || true

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          cd src
          BIN=""
          for cand in bin/hev-socks5-tunnel build/hev-socks5-tunnel hev-socks5-tunnel; do
            if [ -x "$cand" ]; then BIN="$cand"; break; fi
          done
          if [ -z "$BIN" ]; then
            BIN=$(find . -type f -executable -not -path "./third-part/*" \
              | xargs -r file 2>/dev/null \
              | grep -i "ELF.*executable.*ARM aarch64" \
              | head -1 | cut -d: -f1 || true)
          fi
          if [ -z "$BIN" ]; then
            echo "No binary found. Tree:"
            find . -type f -not -path "./third-part/*" | head -40
            exit 1
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          file "$BIN"
          ls -lh "$BIN"

      - name: Install into jniLibs
        run: |
          set -euo pipefail
          mkdir -p android-extra/jniLibs/arm64-v8a
          cp "src/$BIN" android-extra/jniLibs/arm64-v8a/libtun2socks.so
          chmod +x android-extra/jniLibs/arm64-v8a/libtun2socks.so
          file android-extra/jniLibs/arm64-v8a/libtun2socks.so
          ls -lh android-extra/jniLibs/arm64-v8a/libtun2socks.so

      - name: Commit .so back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-extra/jniLibs/arm64-v8a/libtun2socks.so
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "[skip ci] chore(hev): build hev-socks5-tunnel 2.18.0 for arm64-v8a"
          git push
