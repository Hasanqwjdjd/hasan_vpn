name: Build HEV tun2socks (arm64-v8a)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 git

      - name: Clone hev-socks5-tunnel 2.18.0
        run: |
          git clone --depth 1 --branch 2.18.0 \
            https://github.com/heiher/hev-socks5-tunnel.git src

      - name: Build for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd src
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc)"
          echo "=== built files ==="
          find build -type f -executable -exec file {} \;

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          cd src
          BIN=$(find build -type f -executable -name "hev-socks5-tunnel" | head -1 || true)
          if [ -z "$BIN" ]; then
            BIN=$(find build -type f -executable | grep -vE "\.(so|a|cmake)$" | head -1 || true)
          fi
          if [ -z "$BIN" ]; then
            echo "No binary found" >&2
            find build -type f | head -40
            exit 1
          fi
          echo "Binary: $BIN"
          file "$BIN"
          ls -lh "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install into jniLibs
        run: |
          set -euo pipefail
          mkdir -p android-extra/jniLibs/arm64-v8a
          cp "src/$BIN" android-extra/jniLibs/arm64-v8a/libtun2socks.so
          chmod +x android-extra/jniLibs/arm64-v8a/libtun2socks.so
          ls -lh android-extra/jniLibs/arm64-v8a/libtun2socks.so
          file android-extra/jniLibs/arm64-v8a/libtun2socks.so

      - name: Commit .so back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-extra/jniLibs/arm64-v8a/libtun2socks.so
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "[skip ci] chore(hev): build hev-socks5-tunnel 2.18.0 for arm64-v8a"
          git push
