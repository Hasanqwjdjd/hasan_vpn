name: Build Native Libraries (arm64-v8a)

on:
  workflow_dispatch:

env:
  ANDROID_API: 21
  ABI: arm64-v8a
  NDK_VERSION: "r26d"

jobs:
  # ====================================================================
  # 1. DNSTT (Go) — cross-compile with NDK clang
  # ====================================================================
  dnstt:
    name: Build DNSTT
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      PIN_SHA: "4293e24"
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-dnstt-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-dnstt-

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Checkout dnstt at pinned commit
        run: |
          set -euo pipefail
          git clone https://github.com/Mygod/dnstt.git src
          cd src
          git checkout "${PIN_SHA}"
          echo "RESOLVED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build (client binary, netcgo enabled)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p out
          cd src/dnstt-client
          CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" \
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
          go build -tags=netcgo -o ../../out/libdnstt.so .

      - name: Verify output
        run: |
          set -euo pipefail
          cd out
          file libdnstt.so | tee file_output.txt
          readelf -h libdnstt.so | grep Machine | tee -a file_output.txt
          nm -D libdnstt.so | head -20 | tee -a file_output.txt || true

      - name: Write BUILD_INFO.txt
        run: |
          cat > out/BUILD_INFO.txt <<EOF
          Library: dnstt
          Upstream: https://github.com/Mygod/dnstt
          Commit SHA: ${RESOLVED_SHA}
          Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Runner: ubuntu-22.04
          NDK: ${NDK_VERSION}
          Flags: GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -tags=netcgo
          File size: $(stat -c%s out/libdnstt.so)
          Output verified: file / readelf / nm (see file_output.txt)
          EOF

      - name: Write README.md
        run: |
          cat > out/README.md <<'EOF'
          # dnstt-arm64
          Compiled dnstt client binary (arm64-v8a) tunneling TCP over DNS.
          See BUILD_INFO.txt for provenance. Server-side (dnstt-server) is
          not included; you must run it on your own VPS.
          EOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnstt-arm64
          path: out/
          if-no-files-found: warn

  # ====================================================================
  # 2. Slipstream (Rust) — QUIC over DNS
  # ====================================================================
  slipstream:
    name: Build Slipstream
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      PIN_SHA: "42e3e75"
    steps:
      - name: Install build deps for picoquic
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 cmake make perl git build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-slipstream-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-slipstream-

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Export ANDROID_NDK_ROOT so cargo-ndk uses the pinned NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Checkout slipstream-rust at pinned commit
        run: |
          set -euo pipefail
          git clone https://github.com/Mygod/slipstream-rust.git src
          cd src
          git checkout "${PIN_SHA}"
          # picoquic lives in a git submodule; fetch it recursively.
          git submodule update --init --recursive
          echo "RESOLVED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build OpenSSL for Android arm64 (needed by slipstream via native-tls)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # Build a minimal OpenSSL sysroot for aarch64-linux-android.
          # slipstream's native-tls dep needs libssl/libcrypto for the target.
          git clone --depth 1 --branch openssl-3.0.15 https://github.com/openssl/openssl.git /tmp/openssl
          cd /tmp/openssl
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ./Configure android-arm64 -D__ANDROID_API__=${ANDROID_API} \
            --prefix=/tmp/openssl-out --openssldir=/tmp/openssl-out \
            no-tests no-shared
          make -j"$(nproc)" build_libs
          make install_sw
          ls -la /tmp/openssl-out/lib/

      - name: Build (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # openssl-sys (Rust crate) — for native-tls
          OPENSSL_DIR: /tmp/openssl-out
          OPENSSL_STATIC: "1"
          OPENSSL_NO_VENDOR: "1"
          # CMake (picoquic auto-build) — needs these to find cross-OpenSSL
          OPENSSL_ROOT_DIR: /tmp/openssl-out
          OPENSSL_INCLUDE_DIR: /tmp/openssl-out/include
          OPENSSL_CRYPTO_LIBRARY: /tmp/openssl-out/lib/libcrypto.a
          OPENSSL_SSL_LIBRARY: /tmp/openssl-out/lib/libssl.a
          OPENSSL_USE_STATIC_LIBS: "TRUE"
          CMAKE_PREFIX_PATH: /tmp/openssl-out
          # PKG_CONFIG_LIBDIR REPLACES default search paths so pkg-config
          # never picks up host x86_64 brotli/openssl .pc files.
          PKG_CONFIG_LIBDIR: /tmp/openssl-out/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          # --- Force cc-rs / bindgen / pkg-config to use NDK aarch64. ---
          # We hit an "incompatible with aarch64linux" link error because
          # slipstream-ffi's build.rs compiled some C sources with the HOST
          # compiler. cc-rs reads env vars in multiple spellings; set them all.
          NDK_BIN: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          NDK_SYSROOT: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # TARGET_* (cc-rs fallback when <target>_CC missing)
          TARGET_CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          TARGET_CXX: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          TARGET_AR: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          # cc-rs canonical: CC_<target-uppercase-underscored>
          CC_AARCH64_LINUX_ANDROID: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CXX_AARCH64_LINUX_ANDROID: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          AR_AARCH64_LINUX_ANDROID: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS_AARCH64_LINUX_ANDROID: ""
          CXXFLAGS_AARCH64_LINUX_ANDROID: ""
          # NOTE: GitHub Actions normalizes env var names case-insensitively
          # and treats `_` and `-` as equivalent, so we can only use ONE
          # spelling. cc-rs's canonical lookup is CC_<TARGET_UPPER_UNDERSCORE>.
          BINDGEN_EXTRA_CLANG_ARGS: --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # SlipNet/slipstream-ffi build script fallbacks (see rerun-if-changed)
          RUST_ANDROID_GRADLE_CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          RUST_ANDROID_GRADLE_AR: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          set -euo pipefail
          # Hide host brotli .pc files so picoquic/picotls disables the
          # optional brotli cert-compression path.
          sudo rm -f /usr/lib/x86_64-linux-gnu/pkgconfig/libbrotli*.pc || true
          sudo rm -f /usr/lib/pkgconfig/libbrotli*.pc || true
          mkdir -p out
          cd src
          # Wipe any prior host-target artifacts to avoid aarch64<->x86_64
          # object mixing (picoquic's build script cc compiles some C sources
          # via the host toolchain when cached).
          cargo clean || true
          rm -rf .picoquic-build
          # Diagnostic: print CC env vars so we can see what cc-rs picks up
          echo "===== ENV DUMP ====="
          env | grep -iE "^(CC|CXX|AR|TARGET_CC|CFLAGS|RUST_ANDROID)" | sort
          echo "===== cargo ndk build ====="
          # NOTE: slipstream-client is a `[[bin]]`, not a cdylib, so we do NOT
          # pass -o to cargo-ndk (it would complain "no usable artifacts").
          # Build normally, then copy the binary from target/ ourselves.
          cargo ndk -t arm64-v8a build --release -p slipstream-client

      - name: Rename to lib*.so (Android requirement)
        run: |
          set -euo pipefail
          # cargo-ndk ran inside src/, so the binary is under src/target/.
          cd src
          BIN=$(find target -type f -name 'slipstream-client' | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: slipstream-client not found. Listing executables:"
            find target -type f -executable | head -30 || true
            exit 1
          fi
          echo "Found binary: $BIN"
          mkdir -p ../out/flat
          cp "$BIN" ../out/flat/libslipstream_client.so
          chmod 755 ../out/flat/libslipstream_client.so
          file ../out/flat/libslipstream_client.so || true
          echo "SO_FILE=libslipstream_client.so" >> "$GITHUB_ENV"
          ls -la ../out/flat/

      - name: Verify output
        run: |
          set -euo pipefail
          cd out/flat
          file libslipstream_client.so | tee file_output.txt
          readelf -h libslipstream_client.so | grep Machine | tee -a file_output.txt
          nm -D libslipstream_client.so | head -20 | tee -a file_output.txt || true

      - name: Write BUILD_INFO.txt
        run: |
          cat > out/BUILD_INFO.txt <<EOF
          Library: slipstream
          Upstream: https://github.com/Mygod/slipstream-rust
          Commit SHA: ${RESOLVED_SHA}
          Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Runner: ubuntu-22.04
          NDK: ${NDK_VERSION}
          Flags: cargo ndk -t arm64-v8a build --release -p slipstream-client
          Renamed to: libslipstream_client.so (Android requirement)
          File size: $(stat -c%s out/flat/libslipstream_client.so)
          Output verified: file / readelf / nm (see file_output.txt)
          EOF

      - name: Write README.md
        run: |
          cat > out/README.md <<'EOF'
          # slipstream-arm64
          Compiled slipstream-client (arm64-v8a), QUIC-based covert channel
          over DNS. Renamed to libslipstream_client.so for Android packaging.
          Server component (slipgate) not included.
          EOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-arm64
          path: out/
          if-no-files-found: warn

  # ====================================================================
  # 3. NaiveProxy — untested best-effort attempt (per explicit user request)
  #
  # HONESTY NOTE (read before relying on this job):
  # The brief asked for "gclient sync with --no-history and custom_deps to
  # strip docs/tests/locales/branding/samples". That is NOT wired in below,
  # and here's why: naiveproxy's own get-clang.sh / build.sh scripts drive
  # their own Chromium source fetch internally (they are not a thin wrapper
  # around a plain `gclient sync` we can intercept from outside). Injecting
  # our own .gclient / custom_deps ahead of them would either be ignored or
  # would require patching naiveproxy's own build scripts, which is a much
  # bigger and riskier change than a workflow edit and wasn't requested.
  # Faking a custom_deps block that doesn't actually reduce anything would
  # be worse than admitting the limitation, so it's left out.
  #
  # What IS actually done to reduce footprint / risk within a plain
  # workflow edit:
  #   - hard disk-space gate BEFORE any network fetch (exits clean if <25GB)
  #   - --no-history / --depth=1 on every git clone we control ourselves
  #   - aggressive pre-cleanup of preinstalled runner toolchains
  #   - 90-minute cap (not 360) so a stuck build fails fast
  #   - every failure path writes SKIPPED.txt and exits 0 rather than
  #     failing the job, so this never blocks dnstt/slipstream
  #
  # Realistic expectation: even naiveproxy's trimmed fetch has been reported
  # to need well over 25GB free once build artifacts are included, so this
  # will likely still SKIP on a standard GitHub-hosted runner. Confirmed
  # working alternative remains a prebuilt aarch64-linux-android binary you
  # audit yourself (readelf/nm/ldd) and drop into jniLibs directly.
  # ====================================================================
  naiveproxy:
    name: Build NaiveProxy (best-effort, untested)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      PIN_SHA: "3ba967e2"
    steps:
      - name: Check available disk space (before touching anything)
        id: disk
        run: |
          set -euo pipefail
          mkdir -p out
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available: ${AVAIL_GB} GB"
          echo "avail_gb=${AVAIL_GB}" >> "$GITHUB_OUTPUT"
          if [ "${AVAIL_GB}" -lt 25 ]; then
            echo "SKIPPED: only ${AVAIL_GB} GB free before cleanup (need >=25GB). Exiting immediately, no network fetch attempted." > out/SKIPPED.txt
            echo "SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Free up disk space (only if attempting a build)
        if: env.SKIPPED != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true

      - name: Re-check disk space after cleanup
        if: env.SKIPPED != 'true'
        run: |
          set -euo pipefail
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available after cleanup: ${AVAIL_GB} GB"
          if [ "${AVAIL_GB}" -lt 25 ]; then
            echo "SKIPPED: only ${AVAIL_GB} GB free even after cleanup (need >=25GB)." > out/SKIPPED.txt
            echo "SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Fetch depot_tools (shallow)
        if: env.SKIPPED != 'true'
        run: |
          set -euo pipefail
          git clone --depth=1 --no-tags https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            || { echo "SKIPPED: depot_tools clone failed" > out/SKIPPED.txt; echo "SKIPPED=true" >> "$GITHUB_ENV"; exit 0; }
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch naiveproxy source (shallow, single commit)
        if: env.SKIPPED != 'true'
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/klzgrad/naiveproxy.git src \
            || { echo "SKIPPED: naiveproxy clone failed" > out/SKIPPED.txt; echo "SKIPPED=true" >> "$GITHUB_ENV"; exit 0; }
          cd src
          git checkout "${PIN_SHA}" || true
          echo "RESOLVED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build (android/arm64) — best effort, always exits 0
        if: env.SKIPPED != 'true'
        run: |
          set -uo pipefail
          cd src
          EXTRA_FLAGS='target_os="android" target_cpu="arm64"' ./get-clang.sh || {
            echo "SKIPPED: get-clang.sh failed (toolchain/DEPS fetch, likely disk or network)" > ../out/SKIPPED.txt
            echo "SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          }
          EXTRA_FLAGS='target_os="android" target_cpu="arm64"' ./build.sh || {
            echo "SKIPPED: build.sh failed (compile/link step)" > ../out/SKIPPED.txt
            echo "SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          }
          find . -maxdepth 4 -name 'naive' -type f -exec cp {} ../out/ \; || true
          if [ ! -f ../out/naive ]; then
            echo "SKIPPED: build.sh reported success but no 'naive' binary was found" > ../out/SKIPPED.txt
            echo "SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Verify output (only if a binary exists)
        if: always()
        run: |
          cd out
          if [ -f naive ]; then
            file naive | tee file_output.txt
            readelf -h naive | grep Machine | tee -a file_output.txt
            readelf -d naive 2>/dev/null | grep NEEDED | tee -a file_output.txt || true
            nm -D naive 2>/dev/null | head -20 | tee -a file_output.txt || true
          fi

      - name: Write BUILD_INFO.txt
        if: always()
        run: |
          mkdir -p out
          cat > out/BUILD_INFO.txt <<EOF
          Library: naiveproxy
          Upstream: https://github.com/klzgrad/naiveproxy
          Commit SHA: ${RESOLVED_SHA:-N/A}
          Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Runner: ubuntu-22.04
          Timeout: 90 minutes
          Notes: Best-effort untested job. See in-file HONESTY NOTE above the
                 job definition for why gclient custom_deps stripping was not
                 implemented. Check SKIPPED.txt for the specific failure point
                 if no 'naive' binary is present in this artifact.
          EOF

      - name: Upload artifact (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naiveproxy-arm64
          path: out/
          if-no-files-found: warn

  # ====================================================================
  # 4/5. NoizDNS & VayDNS — placeholder (no independent upstream)
  # ====================================================================
  noizdns:
    name: NoizDNS (skipped — no independent source)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p out
          echo "SKIPPED: No independent, redistributable upstream source located for NoizDNS." > out/SKIPPED.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noizdns-arm64
          path: out/

  vaydns:
    name: VayDNS (skipped — no independent source)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p out
          echo "SKIPPED: No independent, redistributable upstream source located for VayDNS." > out/SKIPPED.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaydns-arm64
          path: out/
