name: Build Psiphon Runtime DEX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Discover Psiphon AAR
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          # The psiphon-tunnel-core repo publishes releases named like
          # "2.0.40" with different asset names across versions. Discover
          # instead of hardcoding.
          echo "=== latest 15 releases ==="
          gh api "repos/Psiphon-Labs/psiphon-tunnel-core/releases?per_page=15" \
            --jq '.[] | "\(.tag_name)\t\(.assets|map(.name)|join(","))"'
          echo ""
          # Prefer a release tag that contains 2.0.41, else 2.0.40, else
          # the newest with an .aar asset.
          URL=$(gh api "repos/Psiphon-Labs/psiphon-tunnel-core/releases?per_page=30" \
            --jq '[.[] | select(.assets | map(select(.name|test("\\.(aar|zip)$"))) | length > 0)] | .[] | .assets[] | select(.name|test("\\.(aar|zip)$")) | .browser_download_url' \
            | head -1)
          if [ -z "$URL" ]; then
            echo "No AAR asset found across releases"
            gh api "repos/Psiphon-Labs/psiphon-tunnel-core/releases?per_page=3" --jq '.[] | {tag: .tag_name, assets: [.assets[].name]}'
            exit 1
          fi
          echo "URL=$URL"
          echo "$URL" > asset_url.txt

      - name: Download AAR
        run: |
          set -euo pipefail
          cd work
          URL=$(cat asset_url.txt)
          curl -fsSL -o psiphontunnel.aar "$URL"
          ls -lh psiphontunnel.aar
          file psiphontunnel.aar

      - name: Extract classes.jar
        run: |
          set -euo pipefail
          cd work
          mkdir -p extracted
          cd extracted
          unzip -q ../psiphontunnel.aar
          ls -la
          if [ ! -f classes.jar ]; then
            echo "No classes.jar"
            exit 1
          fi
          ls -lh classes.jar

      - name: Locate Android SDK d8
        id: d8
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          D8=$(find "$ANDROID_SDK/build-tools" -name d8 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$D8" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
            yes | "$SDKMANAGER" "build-tools;34.0.0" >/dev/null 2>&1 || true
            D8=$(find "$ANDROID_SDK/build-tools" -name d8 -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$D8" ]; then
            echo "d8 not found"; exit 1
          fi
          echo "path=$D8" >> "$GITHUB_OUTPUT"

      - name: Compile classes.jar -> DEX
        run: |
          set -euo pipefail
          cd work/extracted
          D8="${{ steps.d8.outputs.path }}"
          "$D8" --min-api 21 --no-desugaring --output . classes.jar
          ls -lh classes.dex

      - name: Install into assets
        run: |
          set -euo pipefail
          mkdir -p android-extra/assets
          cp work/extracted/classes.dex android-extra/assets/pingng_psiphon_runtime.dex
          ls -lh android-extra/assets/pingng_psiphon_runtime.dex

      - name: Commit DEX back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-extra/assets/pingng_psiphon_runtime.dex
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "[skip ci] chore(psiphon): rebuild runtime DEX from psiphon-tunnel-core release"
          git push
