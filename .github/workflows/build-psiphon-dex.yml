name: Build Psiphon Runtime DEX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq unzip

      - name: Discover Psiphon Android library zip
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          # The releases publish `Psiphon-Android-Library.zip` (not .aar).
          # Pick the newest release that has it. Use `jq first` instead of
          # shell `head -1` so we do not SIGPIPE the gh process (exit 141).
          URL=$(gh api "repos/Psiphon-Labs/psiphon-tunnel-core/releases?per_page=30" \
            --jq '[.[] | {tag: .tag_name, a: (.assets[] | select(.name | test("Android.*\\.zip$"; "i")) | .browser_download_url)} | select(.a != null)] | .[0].a')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No Android library zip found"
            gh api "repos/Psiphon-Labs/psiphon-tunnel-core/releases?per_page=3" \
              --jq '.[] | {tag: .tag_name, assets: [.assets[].name]}'
            exit 1
          fi
          echo "URL=$URL"
          echo "$URL" > asset_url.txt

      - name: Download
        run: |
          set -euo pipefail
          cd work
          URL=$(cat asset_url.txt)
          curl -fsSL -o psiphon.zip "$URL"
          ls -lh psiphon.zip
          file psiphon.zip

      - name: Extract AAR from zip
        run: |
          set -euo pipefail
          cd work
          mkdir -p zipcontents
          unzip -q psiphon.zip -d zipcontents
          echo "=== zip contents ==="
          find zipcontents -maxdepth 3 -type f | head -40
          # Find the .aar inside, or a classes.jar directly
          AAR=$(find zipcontents -name "*.aar" | head -n 1 || true)
          JAR=$(find zipcontents -name "classes.jar" | head -n 1 || true)
          if [ -n "$AAR" ]; then
            echo "AAR=$AAR"
            echo "$AAR" > aar_path.txt
          elif [ -n "$JAR" ]; then
            echo "JAR=$JAR"
            echo "$JAR" > jar_path.txt
          else
            echo "Neither AAR nor classes.jar inside"
            find zipcontents -type f | head -60
            exit 1
          fi

      - name: Extract classes.jar
        run: |
          set -euo pipefail
          cd work
          if [ -f aar_path.txt ]; then
            AAR=$(cat aar_path.txt)
            mkdir -p extracted
            cd extracted
            unzip -q "../$AAR"
            ls -la
            if [ ! -f classes.jar ]; then
              echo "No classes.jar in AAR"
              exit 1
            fi
          else
            JAR=$(cat jar_path.txt)
            mkdir -p extracted
            cp "../$JAR" extracted/classes.jar
            cd extracted
            ls -la
          fi
          ls -lh classes.jar

      - name: Locate Android SDK d8
        id: d8
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          D8=$(find "$ANDROID_SDK/build-tools" -name d8 -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$D8" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
            yes | "$SDKMANAGER" "build-tools;34.0.0" >/dev/null 2>&1 || true
            D8=$(find "$ANDROID_SDK/build-tools" -name d8 -type f 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$D8" ]; then
            echo "d8 not found"; exit 1
          fi
          echo "path=$D8" >> "$GITHUB_OUTPUT"

      - name: Compile classes.jar -> DEX
        run: |
          set -euo pipefail
          cd work/extracted
          D8="${{ steps.d8.outputs.path }}"
          # --min-api 24: d8 refuses "Default interface methods" below API 24,
          # and psiphon-tunnel-core's HostFeedbackHandler uses one. Android
          # 5/6 cover a fraction of a percent of devices; bumping the min
          # here does not affect the app's own minSdk, only this DEX.
          "$D8" --min-api 24 --no-desugaring --output . classes.jar
          ls -lh classes.dex

      - name: Install into assets
        run: |
          set -euo pipefail
          mkdir -p android-extra/assets
          cp work/extracted/classes.dex android-extra/assets/pingng_psiphon_runtime.dex
          ls -lh android-extra/assets/pingng_psiphon_runtime.dex

      - name: Commit DEX back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-extra/assets/pingng_psiphon_runtime.dex
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "[skip ci] chore(psiphon): rebuild runtime DEX from psiphon-tunnel-core release"
          git push
