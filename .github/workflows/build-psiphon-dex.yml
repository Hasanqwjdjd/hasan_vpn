name: Build Psiphon Runtime DEX (2.0.41)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Psiphon AAR
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          # Psiphon publishes releases on GitHub. 2.0.41 was the current
          # stable at the time this was written; the URL pattern is stable
          # across versions.
          URL="https://github.com/Psiphon-Labs/psiphon-tunnel-core/releases/download/v2.0.41/psiphontunnel.aar"
          echo "Downloading $URL"
          curl -fsSL -o psiphontunnel.aar "$URL"
          ls -lh psiphontunnel.aar
          file psiphontunnel.aar

      - name: Extract classes.jar
        run: |
          set -euo pipefail
          cd work
          mkdir -p extracted
          cd extracted
          unzip -q ../psiphontunnel.aar
          ls -la
          if [ ! -f classes.jar ]; then
            echo "No classes.jar in AAR"; exit 1
          fi
          ls -lh classes.jar

      - name: Locate Android SDK d8
        id: d8
        run: |
          set -euo pipefail
          # The GitHub runner image already has Android SDK tools installed
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK=$ANDROID_SDK"
          D8=$(find "$ANDROID_SDK/build-tools" -name d8 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$D8" ]; then
            echo "d8 not found; attempting to install build-tools"
            SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
            yes | "$SDKMANAGER" "build-tools;34.0.0" >/dev/null 2>&1 || true
            D8=$(find "$ANDROID_SDK/build-tools" -name d8 -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$D8" ]; then
            echo "Still no d8"; exit 1
          fi
          echo "D8=$D8"
          echo "path=$D8" >> "$GITHUB_OUTPUT"

      - name: Compile classes.jar -> DEX
        run: |
          set -euo pipefail
          cd work/extracted
          D8="${{ steps.d8.outputs.path }}"
          # --min-api 21 matches the app's minSdk
          # --no-desugaring keeps the output compatible with the runtime
          # class loader used by PsiphonRuntimeService's dedicated
          # PsiphonDexClassLoader.
          "$D8" --min-api 21 --no-desugaring \
            --output . \
            classes.jar
          ls -lh classes.dex
          file classes.dex

      - name: Install into assets
        run: |
          set -euo pipefail
          mkdir -p android-extra/assets
          cp work/extracted/classes.dex android-extra/assets/pingng_psiphon_runtime.dex
          ls -lh android-extra/assets/pingng_psiphon_runtime.dex

      - name: Commit DEX back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-extra/assets/pingng_psiphon_runtime.dex
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "[skip ci] chore(psiphon): rebuild runtime DEX from psiphon-tunnel-core 2.0.41"
          git push
