name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Decode Keystore to absolute path
        run: |
          mkdir -p $HOME/keys
          tr -d '\n' < android-keystore.b64 | tr -d ' ' | base64 -d > $HOME/keys/hasan.jks
          ls -la $HOME/keys/hasan.jks
          echo "--- verify keystore ---"
          keytool -list -keystore $HOME/keys/hasan.jks -storepass hasan12345 -alias hasan

      - name: Create clean Flutter project
        run: flutter create --org com.hasan --project-name hasan_vpn --platforms=android --overwrite build_src

      - name: Copy our app code ON TOP
        run: |
          cp -f app/pubspec.yaml build_src/pubspec.yaml
          rm -rf build_src/lib
          mkdir -p build_src/lib
          cp -r app/lib/. build_src/lib/

      - name: Write settings.gradle
        run: |
          cat > build_src/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          include ":app"
          EOF

      - name: Write gradle wrapper
        run: |
          cat > build_src/android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF

      - name: Write key.properties (absolute path!)
        run: |
          cat > build_src/android/key.properties << EOF
          storePassword=hasan12345
          keyPassword=hasan12345
          keyAlias=hasan
          storeFile=$HOME/keys/hasan.jks
          EOF
          echo "--- key.properties ---"
          cat build_src/android/key.properties

      - name: Write app build.gradle
        run: |
          cat > build_src/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
          if (flutterVersionCode == null) {
              flutterVersionCode = "1"
          }

          def flutterVersionName = localProperties.getProperty("flutter.versionName")
          if (flutterVersionName == null) {
              flutterVersionName = "1.0"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.hasan.hasan_vpn"
              compileSdk = 35
              ndkVersion = "27.0.12077973"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }

              defaultConfig {
                  applicationId = "com.hasan.hasan_vpn"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Add internet permission
        run: |
          MANIFEST=build_src/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"

      - name: Get dependencies
        working-directory: build_src
        run: flutter pub get

      - name: Build APK (split per ABI for smaller size)
        working-directory: build_src
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasan-vpn-apk
          path: build_src/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v6.1.${{ github.run_number }}
          files: build_src/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
