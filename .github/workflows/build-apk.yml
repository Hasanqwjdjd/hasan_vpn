name: Build APK

concurrency:
  group: build-counter-lock
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.counter.outputs.should_build }}
      index: ${{ steps.counter.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read release index
        id: counter
        run: |
          set -e
          if [ -f .build-counter ]; then
            C=$(tr -d ' \n' < .build-counter)
          else
            C=0
          fi
          case "$C" in
            ''|*[!0-9]*) C=0 ;;
          esac
          echo "index=$C" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "Release index: $C (version will be derived from it)" 

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Setup Gradle properties for retry
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
          echo "✅ Gradle retry settings configured"

      - name: Compute app version
        id: appver
        run: |
          # New scheme:
          #   index=0   → 2.0.0
          #   index=1   → 2.0.1
          #   ...
          #   index=9   → 2.0.9
          #   index=10  → 2.1.0
          #   index=199 → 2.19.9
          #   index=200 → 3.0.0
          #   index=201 → 3.0.1
          set -e
          N=${{ needs.check.outputs.index }}
          MAJOR=$(( 2 + N / 200 ))
          MINOR=$(( (N / 10) % 20 ))
          PATCH=$(( N % 10 ))
          CLEAN="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Release index $N → version $CLEAN"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > hasan.keystore
            SP="$KEYSTORE_PASSWORD"
            echo "STORE_PASS=$SP" >> "$GITHUB_ENV"
            echo "KEY_PASS=${KEY_PASSWORD:-$SP}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_NAME=${KEY_ALIAS:-hasan}" >> "$GITHUB_ENV"
            echo "Using keystore from GitHub Secrets"
          else
            echo "::warning::KEYSTORE_BASE64 تنظیم نشده؛ از کلید پیش‌فرض استفاده می‌شود."
            if [ ! -f hasan.keystore ]; then
              keytool -genkey -v \
                -keystore hasan.keystore \
                -alias hasan \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass hasan12345 \
                -keypass hasan12345 \
                -dname "CN=Hasan, OU=Hasan, O=Hasan, L=Tehran, S=Tehran, C=IR"
            fi
            SP="hasan12345"
            echo "STORE_PASS=$SP" >> "$GITHUB_ENV"
            echo "KEY_PASS=hasan12345" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_NAME=hasan" >> "$GITHUB_ENV"
          fi
          keytool -list -keystore hasan.keystore -storepass "$SP" >/dev/null
          echo "keystore OK"

      - name: Create Flutter Android project
        run: |
          set -e
          flutter create --org com.hasan --project-name hasan_vpn --platforms android build_src
          cp -r app/lib/. build_src/lib/
          cp app/pubspec.yaml build_src/pubspec.yaml
          cp hasan.keystore build_src/android/app/hasan.keystore

          # Patch gradle-wrapper.properties: bump Gradle from 8.3 to 8.9
          WRAPPER="build_src/android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's|gradle-8.3-all.zip|gradle-8.9-all.zip|g; s|gradle-8.3-bin.zip|gradle-8.9-all.zip|g' "$WRAPPER"
          echo "----- gradle-wrapper.properties -----"
          cat "$WRAPPER"

          # Patch settings.gradle: bump Kotlin + AGP + add Aliyun mirrors
          python3 << 'PYEOF'
          path = "build_src/android/settings.gradle"
          with open(path, "r") as f:
              text = f.read()

          text = text.replace(
              'org.jetbrains.kotlin.android" version "1.8.22"',
              'org.jetbrains.kotlin.android" version "2.1.0"'
          )
          text = text.replace(
              'com.android.application" version "8.1.0"',
              'com.android.application" version "8.7.0"'
          )
          mirrors = '''        maven { url "https://maven.aliyun.com/repository/google" }
                  maven { url "https://maven.aliyun.com/repository/public" }
                  maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
                  '''
          # Aliyun به‌عنوان fallback بعد از google() و mavenCentral()
          if 'maven.aliyun.com' not in text:
              text = text.replace('mavenCentral()', 'mavenCentral()\n' + mirrors, 1)

          with open(path, "w") as f:
              f.write(text)
          print("✅ settings.gradle patched (Kotlin 2.1.0, AGP 8.7.0, Aliyun mirrors)")
          PYEOF
          cat build_src/android/settings.gradle

      - name: Generate protected default subscriptions
        env:
          DEFAULT_SUBS_JSON: ${{ secrets.DEFAULT_SUBS_JSON }}
        run: |
          python3 tools/gen_protected_defaults.py build_src/lib/services/protected_defaults.g.dart

      - name: Install Aether native (Kotlin) sources
        run: |
          set -e
          KT_DIR="build_src/android/app/src/main/kotlin/com/hasan/hasan_vpn"
          mkdir -p "$KT_DIR"
          rm -f build_src/android/app/src/main/java/com/hasan/hasan_vpn/MainActivity.java 2>/dev/null || true
          cp -f android-extra/kotlin/MainActivity.kt "$KT_DIR/MainActivity.kt"
          cp -f android-extra/kotlin/VpnTuner.kt "$KT_DIR/VpnTuner.kt"
          cp -f android-extra/kotlin/HevLauncher.kt "$KT_DIR/HevLauncher.kt"
          cp -f android-extra/kotlin/BootReceiver.kt "$KT_DIR/BootReceiver.kt"
          cp -f android-extra/kotlin/AetherService.kt "$KT_DIR/AetherService.kt"
          cp -f android-extra/kotlin/TunnelService.kt "$KT_DIR/TunnelService.kt"
          cp -f android-extra/kotlin/TelemetryNotifier.kt "$KT_DIR/TelemetryNotifier.kt"
          cp -f android-extra/kotlin/SafeLog.kt "$KT_DIR/SafeLog.kt"
          cp -f android-extra/kotlin/TorService.kt "$KT_DIR/TorService.kt"
          cp -f android-extra/kotlin/TorForegroundService.kt "$KT_DIR/TorForegroundService.kt"
          cp -f android-extra/kotlin/LiveMonitorService.kt "$KT_DIR/LiveMonitorService.kt"
          cp -f android-extra/kotlin/QuickConnectWidget1x1.kt "$KT_DIR/QuickConnectWidget1x1.kt"
          cp -f android-extra/kotlin/WidgetBgConnectActivity.kt "$KT_DIR/WidgetBgConnectActivity.kt"
          cp -f android-extra/kotlin/WidgetConnectService.kt "$KT_DIR/WidgetConnectService.kt"
          cp -f android-extra/kotlin/WidgetHeadlessActivity.kt "$KT_DIR/WidgetHeadlessActivity.kt"
          cp -f android-extra/kotlin/NotificationHelper.kt "$KT_DIR/NotificationHelper.kt"
          cp -f android-extra/kotlin/MasterDnsService.kt "$KT_DIR/MasterDnsService.kt"
          cp -f android-extra/kotlin/PsiphonRuntimeService.kt "$KT_DIR/PsiphonRuntimeService.kt"
          cp -f android-extra/kotlin/PsiphonStatus.kt "$KT_DIR/PsiphonStatus.kt"
          cp -f android-extra/kotlin/WarpMasqueService.kt "$KT_DIR/WarpMasqueService.kt"
          cp -f android-extra/kotlin/WarpMasqueDesyncProxy.kt "$KT_DIR/WarpMasqueDesyncProxy.kt"
          cp -f android-extra/kotlin/DesyncEngine.kt "$KT_DIR/DesyncEngine.kt"
          CORE_DIR="build_src/android/app/src/main/kotlin/com/v2ray/ang/core"
          mkdir -p "$CORE_DIR"
          cp -f android-extra/kotlin/PingNGProxy.kt "$CORE_DIR/PingNGProxy.kt"
          # Psiphon now runs out-of-process via PsiphonRuntimeService +
          # libpingng_psiphon.so (loaded from pingng_psiphon_runtime.dex).
          # The legacy AAR is kept in the repository as a fallback but is
          # NOT bundled, because its go.Seq/libgojni.so collides with
          # Xray's copy and crashes the process. To fall back to the AAR,
          # revert this block and remove PsiphonRuntimeService from the
          # AndroidManifest patch below.
          cp -f android-extra/kotlin/PsiphonService.kt "$KT_DIR/PsiphonService.kt"
          echo "Psiphon facade installed (AAR kept in repo, not bundled)"

      - name: Install Android widget resources
        run: |
          set -e
          RES_DIR="build_src/android/app/src/main/res"
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/values"
          if [ -d android-extra/res ]; then
            cp -rf android-extra/res/. "$RES_DIR/"
            echo "Widget resources copied"
          fi
          STRINGS="$RES_DIR/values/strings.xml"
          if [ ! -f "$STRINGS" ]; then
            {
              echo '<?xml version="1.0" encoding="utf-8"?>'
              echo '<resources>'
              echo '    <string name="widget_description">Quick connect 2x1</string>'
              echo '    <string name="widget_description_1x1">Quick connect 1x1</string>'
              echo '    <string name="app_name">Hasan VPN</string>'
              echo '</resources>'
            } > "$STRINGS"
          fi


      - name: Psiphon embedded server list (optional)
        run: |
          # FIX: MasterDNS assets (config.toml + resolvers.txt)
          ASSET_DIR="build_src/android/app/src/main/assets"
          mkdir -p "$ASSET_DIR"
          if [ -f android-extra/assets/masterdns/masterdns_client_config.toml ]; then
            cp -f android-extra/assets/masterdns/masterdns_client_config.toml "$ASSET_DIR/masterdns_client_config.toml"
            cp -f android-extra/assets/masterdns/masterdns_client_resolvers.txt "$ASSET_DIR/masterdns_client_resolvers.txt" 2>/dev/null || true
            echo "MasterDNS assets copied"
          fi

          # PingNG Psiphon runtime (DEX + config + server entries)
          if [ -f android-extra/assets/pingng_psiphon_runtime.dex ]; then
            cp -f android-extra/assets/pingng_psiphon_runtime.dex "$ASSET_DIR/pingng_psiphon_runtime.dex"
            cp -f android-extra/assets/pingng_psiphon_config.json "$ASSET_DIR/pingng_psiphon_config.json"
            cp -f android-extra/assets/pingng_psiphon_server_entries.txt "$ASSET_DIR/pingng_psiphon_server_entries.txt"
            echo "Psiphon runtime assets copied"
          fi
          if [ -f android-extra/assets/server_entries.txt ]; then
            cp -f android-extra/assets/server_entries.txt "$ASSET_DIR/server_entries.txt"
            echo "Embedded Psiphon server list included"
          else
            echo "No android-extra/assets/server_entries.txt - Psiphon will download its server list"
          fi

      - name: Install Aether native binaries (jniLibs)
        run: |
          set -e
          JNI_DIR="build_src/android/app/src/main/jniLibs"
          mkdir -p "$JNI_DIR/arm64-v8a" "$JNI_DIR/armeabi-v7a" "$JNI_DIR/x86_64"
          if [ -d android-extra/jniLibs ]; then
            cp -rf android-extra/jniLibs/. "$JNI_DIR/"
          fi
          find "$JNI_DIR" -type f -name "*.so" -exec chmod +x {} \;
          echo "Native binaries installed:"
          find "$JNI_DIR" -type f -name "*.so" || true

      - name: Write v1+v2+v3 signing and VPN manifest
        run: |
          {
            echo "storePassword=${STORE_PASS}"
            echo "keyPassword=${KEY_PASS}"
            echo "keyAlias=${KEY_ALIAS_NAME}"
            echo "storeFile=hasan.keystore"
          } > build_src/android/key.properties

          rm -f build_src/android/app/build.gradle.kts
          cat > build_src/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

          android {
              namespace = "com.hasan.hasan_vpn"
              compileSdk = 35
              ndkVersion = "27.0.12077973"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += ["-Xskip-metadata-version-check"]
              }

              signingConfigs {
                  release {
                      keyAlias = keystoreProperties["keyAlias"]
                      keyPassword = keystoreProperties["keyPassword"]
                      storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword = keystoreProperties["storePassword"]
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }

              defaultConfig {
                  applicationId = "com.hasan.hasan_vpn"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
          }
          EOF

          MF="build_src/android/app/src/main/AndroidManifest.xml"
          python3 - << 'PYEOF'
          import re
          path = "build_src/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          """
          if 'android.permission.INTERNET' not in text:
              text = text.replace("<application", perms + "    <application", 1)
          if 'android:extractNativeLibs' not in text:
              text = text.replace("<application", '<application android:extractNativeLibs="true" android:usesCleartextTraffic="true"', 1)
          if 'android:allowBackup' not in text:
              text = text.replace("<application", '<application android:allowBackup="false"', 1)
          queries = """    <queries>
              <intent>
                  <action android:name="android.net.VpnService"/>
              </intent>
          </queries>
          """
          if '<queries>' not in text:
              text = text.replace("</manifest>", queries + "</manifest>", 1)
          # ثبت TorForegroundService در Manifest
          if 'MasterDnsService' not in text:
              text = text.replace(
                  "</application>",
                  '    <service\n'
                  '        android:enabled="true"\n'
                  '        android:exported="false"\n'
                  '        android:foregroundServiceType="specialUse" />\n'
                  '</application>',
                  1,
              )
              echo_manifest_ok = True
          if 'PsiphonRuntimeService' not in text:
              text = text.replace(
                  "</application>",
                  '    <service\n'
                  '        android:name="com.hasan.hasan_vpn.PsiphonRuntimeService"\n'
                  '        android:enabled="true"\n'
                  '        android:exported="false"\n'
                  '        android:foregroundServiceType="specialUse"\n'
                  '        android:process=":PingNGPsiphon" />\n'
                  '</application>',
                  1,
              )
          if 'WarpMasqueService' not in text:
              text = text.replace(
                  "</application>",
                  '    <service\n'
                  '        android:enabled="true"\n'
                  '        android:exported="false"\n'
                  '        android:foregroundServiceType="specialUse" />\n'
                  '</application>',
                  1,
              )
          if 'TorForegroundService' not in text:
              svc = """    <service
                  android:name="com.hasan.hasan_vpn.TorForegroundService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="specialUse" />
              <service
                  android:name="com.hasan.hasan_vpn.AetherService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="specialUse" />
              <service
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="specialUse" />
          """
              text = text.replace("</application>", svc + "</application>", 1)

          
          if 'BootReceiver' not in text:
              boot = """              <receiver
                  android:name="com.hasan.hasan_vpn.BootReceiver"
                  android:enabled="true"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """
              text = text.replace("</application>", boot + "</application>", 1)

          if 'QuickConnectWidget' not in text:

              widget = """              <receiver
                  android:name="com.hasan.hasan_vpn.QuickConnectWidget1x1"
                  android:enabled="true"
                  android:exported="true"
                  android:label="Hasan VPN 1x1">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/quick_connect_widget_1x1_info" />
              </receiver>


              <activity
                  android:name="com.hasan.hasan_vpn.WidgetBgConnectActivity"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar"
                  android:excludeFromRecents="true"
                  android:taskAffinity=""
                  android:exported="true"
                  android:noHistory="true" />

              <activity
                  android:name="com.hasan.hasan_vpn.WidgetHeadlessActivity"
                  android:theme="@style/Theme.HasanVPN.NoDisplay"
                  android:excludeFromRecents="true"
                  android:taskAffinity=""
                  android:exported="false" />

              <service
                  android:name="com.hasan.hasan_vpn.WidgetConnectService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="specialUse" />
          """
              text = text.replace("</application>", widget + "</application>", 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF

      - name: Copy forked flutter_vless_android into build tree
        run: |
          set -e
          rm -rf build_src/plugins
          mkdir -p build_src/plugins
          cp -a android-extra/plugins/flutter_vless_android \
            build_src/plugins/flutter_vless_android
          # Safety: verify the fork really contains VpnTuner hook
          grep -q "VpnTuner" \
            build_src/plugins/flutter_vless_android/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/service/XrayVPNService.kt \
            || (echo "FATAL: VpnTuner hook missing from fork" && exit 1)
          echo "Forked plugin copied and verified"

      - name: Flutter pub get
        working-directory: build_src
        run: flutter pub get

      - name: Build release APK
        working-directory: build_src
        run: >
          flutter build apk --release --no-shrink
          --obfuscate
          --split-debug-info=build/symbols
          --split-per-abi
          --target-platform android-arm64
          --build-name=${{ steps.appver.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.appver.outputs.version }}
          path: build_src/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: نسخه ${{ steps.appver.outputs.version }}
          body: |
            بیلد خودکار نسخه ${{ steps.appver.outputs.version }}
            شماره اجرا: ${{ github.run_number }}
          files: build_src/build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump_counter:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - name: Bump release index
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          N=${{ needs.check.outputs.index }}
          echo "$((N + 1))" > .build-counter
          git add .build-counter
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] bump release index to $((N + 1))"
            git push
          fi
