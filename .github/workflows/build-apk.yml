# مسیر مقصد در ریپو: .github/workflows/build-apk.yml
# ------------------------------------------------------------
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Ensure keystore exists
        run: |
          if [ ! -f hasan.keystore ]; then
            keytool -genkey -v \
              -keystore hasan.keystore \
              -alias hasan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass hasan12345 \
              -keypass hasan12345 \
              -dname "CN=Hasan, OU=Hasan, O=Hasan, L=Tehran, S=Tehran, C=IR"
          fi
          keytool -list -keystore hasan.keystore -storepass hasan12345 -alias hasan

      - name: Create Flutter Android project
        run: |
          flutter create --org com.hasan --project-name hasan_vpn --platforms=android --overwrite build_src
          cp -f app/pubspec.yaml build_src/pubspec.yaml
          rm -rf build_src/lib
          mkdir -p build_src/lib
          cp -r app/lib/. build_src/lib/
          cp hasan.keystore build_src/android/app/hasan.keystore

      # --- اضافه شد: کدهای بومی Aether (MainActivity.kt + AetherVpnService.kt) ---
      - name: Install Aether native (Kotlin) sources
        run: |
          set -e
          KT_DIR="build_src/android/app/src/main/kotlin/com/hasan/hasan_vpn"
          mkdir -p "$KT_DIR"
          cp -f android-extra/kotlin/MainActivity.kt "$KT_DIR/MainActivity.kt"
          cp -f android-extra/kotlin/AetherVpnService.kt "$KT_DIR/AetherVpnService.kt"
          # اگر flutter create نسخه‌ی java ساخته بود، حذفش کن تا تداخل نکند
          rm -f build_src/android/app/src/main/java/com/hasan/hasan_vpn/MainActivity.java 2>/dev/null || true
          ls -la "$KT_DIR"

      # --- اضافه شد: باینری‌های بومی aether (و در صورت وجود tun2socks) ---
      # این باینری‌ها را خودتان باید در android-extra/jniLibs/<abi>/libaether.so
      # قرار دهید (توضیح کامل در android-extra/README.md). اگر پوشه خالی باشد
      # این مرحله چیزی کپی نمی‌کند و فقط هشدار می‌دهد.
      - name: Install Aether native binaries (jniLibs)
        run: |
          set -e
          SRC="android-extra/jniLibs"
          DST="build_src/android/app/src/main/jniLibs"
          if [ -d "$SRC" ] && [ "$(find "$SRC" -type f | wc -l)" -gt 0 ]; then
            mkdir -p "$DST"
            cp -r "$SRC"/. "$DST"/
            find "$DST" -type f -name "*.so" -exec chmod 755 {} \;
            echo "Copied native libs:"
            find "$DST" -type f
          else
            echo "::warning::android-extra/jniLibs is empty - Aether will build but libaether.so must be added before the Aether feature works on a device. See android-extra/README.md"
          fi

      - name: Force Kotlin 2.1.0 (fix for flutter_vless)
        run: |
          set -e
          echo "=== Fixing Kotlin version ==="
          if [ -f build_src/android/settings.gradle ]; then
            sed -i -E 's/(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+(")/\12.1.0\2/' build_src/android/settings.gradle
            cat build_src/android/settings.gradle
          elif [ -f build_src/android/settings.gradle.kts ]; then
            sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")/\12.1.0\2/' build_src/android/settings.gradle.kts
            cat build_src/android/settings.gradle.kts
          else
            echo "ERROR: settings.gradle not found!"
            ls -la build_src/android/
            exit 1
          fi

      - name: Write v1+v2+v3 signing and VPN manifest
        run: |
          cat > build_src/android/key.properties << 'EOF'
          storePassword=hasan12345
          keyPassword=hasan12345
          keyAlias=hasan
          storeFile=hasan.keystore
          EOF

          rm -f build_src/android/app/build.gradle.kts
          cat > build_src/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.hasan.hasan_vpn"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      v1SigningEnabled true
                      v2SigningEnabled true
                      enableV3Signing true
                  }
              }

              defaultConfig {
                  applicationId = "com.hasan.hasan_vpn"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          python3 << 'PY'
          from pathlib import Path
          p = Path("build_src/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
          """
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", perms + "    <application", 1)
          if 'android:extractNativeLibs' not in text:
              text = text.replace("<application", '<application android:extractNativeLibs="true" android:usesCleartextTraffic="true"', 1)
          queries = """    <queries>
              <intent>
                  <action android:name="android.net.VpnService"/>
              </intent>
          </queries>
          """
          if "android.net.VpnService" not in text:
              text = text.replace("</manifest>", queries + "</manifest>")

          # --- اضافه شد: ثبت AetherVpnService ---
          aether_service = """        <service
                  android:name=".AetherVpnService"
                  android:permission="android.permission.BIND_VPN_SERVICE"
                  android:foregroundServiceType="specialUse"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.net.VpnService"/>
                  </intent-filter>
              </service>
          """
          if 'name=".AetherVpnService"' not in text:
              text = text.replace("</application>", aether_service + "    </application>")

          p.write_text(text)
          print(p.read_text())
          PY

      - name: Flutter pub get
        working-directory: build_src
        run: flutter pub get

      - name: Build ARM APKs
        working-directory: build_src
        run: >
          flutter build apk --release --no-shrink
          --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name=10.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Verify APK has v2 signature
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using $APKSIGNER"
          FAIL=0
          for f in build_src/build/app/outputs/flutter-apk/*.apk; do
            echo "=== $f ==="
            ls -lh "$f"
            OUT=$("$APKSIGNER" verify --verbose "$f" 2>&1) || {
              echo "$OUT"
              echo "apksigner verify FAILED: $f"
              FAIL=1
              continue
            }
            echo "$OUT"
            if ! echo "$OUT" | grep -q "Verified using v2 scheme"; then
              echo "MISSING v2 signature: $f"
              FAIL=1
            fi
          done
          exit "$FAIL"

      - name: Name installer APKs
        run: |
          mkdir -p dist
          VER="10.0.${{ github.run_number }}"
          cp build_src/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Hasan-VPN-v${VER}-arm64.apk"
          cp build_src/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Hasan-VPN-v${VER}.apk"
          if [ -f build_src/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build_src/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Hasan-VPN-v${VER}-32bit.apk"
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasan-vpn-apk
          path: dist/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0.${{ github.run_number }}
          name: حسن VPN v10.0.${{ github.run_number }}
          body: |
            ## نصب روی گوشی اندروید

            **همین فایل را دانلود کنید:** `Hasan-VPN-v10.0.${{ github.run_number }}.apk`

            1. نسخه قبلی برنامه را پاک کنید
            2. فایل را از Downloads باز کنید
            3. اگر پرسید، «نصب از منابع ناشناس» را روشن کنید
            4. اجازه VPN را بدهید

            گوشی‌های خیلی قدیمی ۳۲بیتی: `Hasan-VPN-v10.0.${{ github.run_number }}-32bit.apk`
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
