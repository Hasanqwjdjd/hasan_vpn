name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-keystore.jks

      - name: Create key.properties
        run: |
          cat > key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$(pwd)/android-keystore.jks
          EOF

      - name: Create clean Flutter project
        run: flutter create --org com.hasan --project-name hasan_vpn --platforms=android --overwrite build_src

      - name: Copy our app code ON TOP
        run: |
          cp -f app/pubspec.yaml build_src/pubspec.yaml
          rm -rf build_src/lib
          mkdir -p build_src/lib
          cp -r app/lib/. build_src/lib/
          cp android-keystore.jks build_src/android/
          cp key.properties build_src/android/

      - name: Upgrade AGP, Gradle, Kotlin, SDK, NDK
        run: |
          SETTINGS=build_src/android/settings.gradle
          sed -i 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.3.0"/g' "$SETTINGS"
          sed -i 's/id "com.android.library" version "[0-9.]*"/id "com.android.library" version "8.3.0"/g' "$SETTINGS"
          # ⭐ Kotlin 2.1.0 (به جای 1.9.22)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' "$SETTINGS"
          
          WRAPPER=build_src/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|' "$WRAPPER"
          
          BUILDGRADLE=build_src/android/app/build.gradle
          # compileSdk 35
          sed -i 's/compileSdk .*/compileSdk 35/' "$BUILDGRADLE"
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' "$BUILDGRADLE"
          # minSdk 23
          sed -i 's/minSdk .*/minSdk 23/' "$BUILDGRADLE"
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' "$BUILDGRADLE"
          sed -i 's/flutter.minSdkVersion/23/g' "$BUILDGRADLE"
          # targetSdk 34
          sed -i 's/targetSdk .*/targetSdk 34/' "$BUILDGRADLE"
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' "$BUILDGRADLE"
          # ⭐ NDK 27.0.12077973 (جدیدتر)
          if ! grep -q "ndkVersion" "$BUILDGRADLE"; then
            sed -i 's/compileSdk 35/compileSdk 35\n    ndkVersion "27.0.12077973"/' "$BUILDGRADLE"
          else
            sed -i 's/ndkVersion .*/ndkVersion "27.0.12077973"/' "$BUILDGRADLE"
          fi
          
          # ⭐ تنظیمات Kotlin JVM target
          if ! grep -q "kotlinOptions" "$BUILDGRADLE"; then
            sed -i 's/compileOptions {/kotlinOptions {\n        jvmTarget = "17"\n    }\n    compileOptions {/' "$BUILDGRADLE"
          fi

      - name: Patch signing
        run: |
          python3 << 'PYEOF'
          path = "build_src/android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          if "import java.util.Properties" not in content:
              content = "import java.util.Properties\nimport java.io.FileInputStream\n" + content

          keystore_block = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystoreProperties = new Properties()" not in content:
              content = content.replace("android {", keystore_block + "\nandroid {", 1)

          signing_block = '''    signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                  storePassword keystoreProperties['storePassword']
              }
          }
          '''
          if "signingConfigs {" not in content:
              content = content.replace("android {", "android {\n" + signing_block, 1)

          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          with open(path, "w") as f:
              f.write(content)
          PYEOF

          MANIFEST=build_src/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"

      - name: Get dependencies
        working-directory: build_src
        run: flutter pub get

      - name: Build APK
        working-directory: build_src
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasan-vpn-apk
          path: build_src/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v6.0.${{ github.run_number }}
          files: build_src/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
