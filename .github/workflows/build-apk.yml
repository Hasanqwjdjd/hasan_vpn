name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create clean Flutter project
        run: flutter create --org com.hasan --project-name hasan_vpn --platforms=android --overwrite build_src

      - name: Copy our app code ON TOP
        run: |
          cp -f app/pubspec.yaml build_src/pubspec.yaml
          rm -rf build_src/lib
          mkdir -p build_src/lib
          cp -r app/lib/. build_src/lib/

      - name: Add Internet permission and Queries
        run: |
          MANIFEST=build_src/android/app/src/main/AndroidManifest.xml
          
          # ۱. اضافه کردن مجوز اینترنت
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          
          # ۲. اضافه کردن queries قبل از </manifest>
          python3 << 'EOF'
          import re
          path = "build_src/android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          
          queries = '''    <queries>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="trojan" />
              </intent>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="vless" />
              </intent>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="vmess" />
              </intent>
              <intent>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="ss" />
              </intent>
          </queries>
          '''
          
          # اضافه کردن queries قبل از </manifest>
          content = content.replace("</manifest>", queries + "</manifest>")
          
          with open(path, "w") as f:
              f.write(content)
          EOF
          
          echo "--- AndroidManifest ---"
          cat "$MANIFEST"

      - name: Get dependencies
        working-directory: build_src
        run: flutter pub get

      - name: Build APK
        working-directory: build_src
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasan-vpn-apk
          path: build_src/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3.0.${{ github.run_number }}
          files: build_src/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
