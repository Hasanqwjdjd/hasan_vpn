name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Ensure keystore exists
        run: |
          if [ ! -f hasan.keystore ]; then
            keytool -genkey -v \
              -keystore hasan.keystore \
              -alias hasan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass hasan12345 \
              -keypass hasan12345 \
              -dname "CN=Hasan, OU=Hasan, O=Hasan, L=Tehran, S=Tehran, C=IR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hasan.keystore
            git commit -m "Add keystore (auto-generated)"
            git push
          fi
          keytool -list -keystore hasan.keystore -storepass hasan12345 -alias hasan

      - name: Create clean Flutter project
        run: flutter create --org com.hasan --project-name hasan_vpn --platforms=android --overwrite build_src

      - name: Copy our app code ON TOP
        run: |
          cp -f app/pubspec.yaml build_src/pubspec.yaml
          rm -rf build_src/lib
          mkdir -p build_src/lib
          cp -r app/lib/. build_src/lib/
          cp hasan.keystore build_src/android/

      - name: Write settings.gradle
        run: |
          cat > build_src/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.7.2" apply false
              id "org.jetbrains.kotlin.android" version "2.2.0" apply false
          }

          include ":app"
          EOF

      - name: Write gradle wrapper
        run: |
          cat > build_src/android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
          EOF

      - name: Write key.properties
        run: |
          cat > build_src/android/key.properties << 'EOF'
          storePassword=hasan12345
          keyPassword=hasan12345
          keyAlias=hasan
          storeFile=../hasan.keystore
          EOF

      - name: Write app build.gradle
        run: |
          cat > build_src/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
          if (flutterVersionCode == null) {
              flutterVersionCode = "1"
          }

          def flutterVersionName = localProperties.getProperty("flutter.versionName")
          if (flutterVersionName == null) {
              flutterVersionName = "1.0"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.hasan.hasan_vpn"
              compileSdk = 35
              ndkVersion = "27.0.12077973"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                      v1SigningEnabled true
                      v2SigningEnabled false
                  }
              }

              defaultConfig {
                  applicationId = "com.hasan.hasan_vpn"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Add internet permission
        run: |
          MANIFEST=build_src/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"

      - name: Get dependencies
        working-directory: build_src
        run: |
          flutter clean
          flutter pub get
          flutter precache

      - name: Build APK
        working-directory: build_src
        run: flutter build apk --release --split-per-abi --no-shrink

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          for f in build_src/build/app/outputs/flutter-apk/*.apk; do
            echo "=== Checking $f ==="
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose "$f" || echo "SIGNATURE FAILED: $f"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasan-vpn-apk
          path: build_src/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v9.0.${{ github.run_number }}
          files: build_src/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
